## Railway: frontend service (Next.js)
##
## Создайте отдельный сервис из этого же репо и в настройках укажите
## Root Directory = frontend. Этот railway.toml тогда подхватится автоматически.
##
## Перед билдом обязательно задайте:
##   NEXT_PUBLIC_API_BASE_URL — публичный URL бэкенда (https://...up.railway.app)
##   NEXT_PUBLIC_APP_URL      — публичный URL самого фронта (https://...up.railway.app)

[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm run start -- -p ${PORT:-3000}"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
