<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Main moon surface gradient — lit from upper-left -->
    <radialGradient id="moonSurface" cx="0.35" cy="0.32" r="0.65" fx="0.3" fy="0.28">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="12%" stop-color="#ede5d6"/>
      <stop offset="28%" stop-color="#d6cbb8"/>
      <stop offset="45%" stop-color="#b8aa94"/>
      <stop offset="62%" stop-color="#8e8270"/>
      <stop offset="78%" stop-color="#5c5448"/>
      <stop offset="90%" stop-color="#332e28"/>
      <stop offset="100%" stop-color="#1a1714"/>
    </radialGradient>

    <!-- Terminator shadow -->
    <radialGradient id="terminator" cx="0.78" cy="0.72" r="0.6">
      <stop offset="0%" stop-color="rgba(0,0,0,0.65)"/>
      <stop offset="35%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="60%" stop-color="rgba(0,0,0,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- Outer halo glow -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(255,250,235,0.0)"/>
      <stop offset="55%" stop-color="rgba(255,248,220,0.0)"/>
      <stop offset="72%" stop-color="rgba(255,245,210,0.12)"/>
      <stop offset="85%" stop-color="rgba(255,240,200,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,235,190,0.0)"/>
    </radialGradient>

    <!-- Inner rim light -->
    <radialGradient id="rimLight" cx="0.28" cy="0.26" r="0.52">
      <stop offset="0%" stop-color="rgba(255,252,240,0.25)"/>
      <stop offset="40%" stop-color="rgba(255,248,230,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,245,220,0.0)"/>
    </radialGradient>

    <!-- Mare (dark patches) fills -->
    <radialGradient id="mare1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(60,54,44,0.4)"/>
      <stop offset="100%" stop-color="rgba(60,54,44,0.0)"/>
    </radialGradient>
    <radialGradient id="mare2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(55,50,42,0.35)"/>
      <stop offset="100%" stop-color="rgba(55,50,42,0.0)"/>
    </radialGradient>
    <radialGradient id="mare3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(50,45,38,0.30)"/>
      <stop offset="100%" stop-color="rgba(50,45,38,0.0)"/>
    </radialGradient>

    <!-- Crater shadow -->
    <radialGradient id="craterShadow" cx="0.45" cy="0.55" r="0.5">
      <stop offset="0%" stop-color="rgba(0,0,0,0.5)"/>
      <stop offset="70%" stop-color="rgba(0,0,0,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.0)"/>
    </radialGradient>

    <!-- Crater rim highlight -->
    <radialGradient id="craterRim" cx="0.35" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="rgba(255,250,235,0.5)"/>
      <stop offset="50%" stop-color="rgba(255,248,230,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,245,220,0.0)"/>
    </radialGradient>

    <!-- Surface texture noise filter -->
    <filter id="surfaceNoise" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="42" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft glow filter for the halo -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip for moon disc -->
    <clipPath id="moonClip">
      <circle cx="200" cy="200" r="155"/>
    </clipPath>
  </defs>

  <!-- Atmospheric halo / bloom -->
  <circle cx="200" cy="200" r="195" fill="url(#halo)" opacity="0.9"/>

  <!-- Moon base disc -->
  <circle cx="200" cy="200" r="155" fill="url(#moonSurface)"/>

  <!-- Surface detail group — clipped to moon disc -->
  <g clip-path="url(#moonClip)">
    <!-- Surface texture -->
    <circle cx="200" cy="200" r="155" fill="url(#moonSurface)" filter="url(#surfaceNoise)" opacity="0.3"/>

    <!-- Mare — large dark basalt patches -->
    <ellipse cx="155" cy="135" rx="42" ry="36" fill="url(#mare1)"/>
    <ellipse cx="210" cy="175" rx="34" ry="38" fill="url(#mare2)"/>
    <ellipse cx="140" cy="215" rx="38" ry="28" fill="url(#mare3)"/>
    <ellipse cx="235" cy="130" rx="22" ry="26" fill="url(#mare2)" opacity="0.7"/>
    <ellipse cx="175" cy="260" rx="30" ry="22" fill="url(#mare1)" opacity="0.6"/>

    <!-- Large craters with rim + shadow -->
    <!-- Tycho-like crater -->
    <circle cx="148" cy="108" r="12" fill="rgba(0,0,0,0.25)"/>
    <circle cx="146" cy="106" r="11" fill="none" stroke="rgba(255,250,235,0.35)" stroke-width="1.5"/>
    
    <!-- Copernicus-like -->
    <circle cx="220" cy="155" r="15" fill="rgba(0,0,0,0.2)"/>
    <circle cx="218" cy="153" r="14" fill="none" stroke="rgba(255,250,235,0.3)" stroke-width="1.8"/>
    
    <!-- Kepler-like -->
    <circle cx="175" cy="195" r="10" fill="rgba(0,0,0,0.22)"/>
    <circle cx="173" cy="193" r="9.5" fill="none" stroke="rgba(255,250,235,0.28)" stroke-width="1.2"/>
    
    <!-- Aristarchus-like (bright) -->
    <circle cx="125" cy="170" r="8" fill="rgba(40,36,30,0.3)"/>
    <circle cx="124" cy="168" r="7.5" fill="none" stroke="rgba(255,252,240,0.4)" stroke-width="1.4"/>
    
    <!-- Medium craters -->
    <circle cx="260" cy="190" r="9" fill="rgba(0,0,0,0.18)"/>
    <circle cx="258" cy="188" r="8.5" fill="none" stroke="rgba(255,248,230,0.22)" stroke-width="1"/>
    
    <circle cx="190" cy="240" r="11" fill="rgba(0,0,0,0.2)"/>
    <circle cx="188" cy="238" r="10.5" fill="none" stroke="rgba(255,248,230,0.25)" stroke-width="1.2"/>
    
    <circle cx="155" cy="280" r="8" fill="rgba(0,0,0,0.18)"/>
    <circle cx="153" cy="278" r="7.5" fill="none" stroke="rgba(255,248,230,0.2)" stroke-width="1"/>
    
    <circle cx="240" cy="240" r="7" fill="rgba(0,0,0,0.16)"/>
    <circle cx="238" cy="238" r="6.5" fill="none" stroke="rgba(255,248,230,0.18)" stroke-width="0.9"/>

    <!-- Small craters (specks) -->
    <circle cx="170" cy="135" r="4" fill="rgba(0,0,0,0.2)"/>
    <circle cx="200" cy="120" r="3.5" fill="rgba(0,0,0,0.18)"/>
    <circle cx="135" cy="145" r="3" fill="rgba(0,0,0,0.16)"/>
    <circle cx="230" cy="175" r="4.5" fill="rgba(0,0,0,0.15)"/>
    <circle cx="160" cy="230" r="3.5" fill="rgba(0,0,0,0.17)"/>
    <circle cx="210" cy="210" r="3" fill="rgba(0,0,0,0.14)"/>
    <circle cx="250" cy="160" r="3" fill="rgba(0,0,0,0.15)"/>
    <circle cx="145" cy="250" r="4" fill="rgba(0,0,0,0.16)"/>
    <circle cx="270" cy="220" r="3.5" fill="rgba(0,0,0,0.13)"/>
    <circle cx="185" cy="155" r="2.5" fill="rgba(0,0,0,0.14)"/>
    <circle cx="120" cy="200" r="3" fill="rgba(0,0,0,0.15)"/>
    <circle cx="205" cy="270" r="3.5" fill="rgba(0,0,0,0.14)"/>
    <circle cx="230" cy="260" r="2.5" fill="rgba(0,0,0,0.12)"/>
    <circle cx="165" cy="165" r="2" fill="rgba(0,0,0,0.13)"/>
    <circle cx="280" cy="200" r="2.5" fill="rgba(0,0,0,0.11)"/>

    <!-- Tiny ray patterns from bright craters -->
    <line x1="148" y1="96" x2="152" y2="84" stroke="rgba(255,250,235,0.08)" stroke-width="0.8"/>
    <line x1="140" y1="100" x2="132" y2="90" stroke="rgba(255,250,235,0.06)" stroke-width="0.7"/>
    <line x1="156" y1="100" x2="165" y2="88" stroke="rgba(255,250,235,0.07)" stroke-width="0.7"/>

    <!-- Rim light overlay -->
    <circle cx="200" cy="200" r="155" fill="url(#rimLight)"/>

    <!-- Terminator (day/night boundary) -->
    <circle cx="200" cy="200" r="155" fill="url(#terminator)"/>
  </g>

  <!-- Outer edge definition — very subtle dark ring to separate from background -->
  <circle cx="200" cy="200" r="155" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>

  <!-- Outer glow ring -->
  <circle cx="200" cy="200" r="158" fill="none" stroke="rgba(255,248,225,0.08)" stroke-width="3" filter="url(#glowFilter)"/>
</svg>
