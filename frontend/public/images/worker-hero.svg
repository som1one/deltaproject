<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Background -->
  <rect width="320" height="180" rx="16" fill="#0d0d11"/>

  <!-- Abstract circles -->
  <circle cx="160" cy="90" r="72" stroke="#2c6dff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="160" cy="90" r="48" stroke="#2c6dff" stroke-width="1" opacity="0.25"/>
  <circle cx="160" cy="90" r="24" fill="rgba(44,109,255,0.18)" stroke="#5b8fff" stroke-width="1.5" opacity="0.7"/>

  <!-- Lines radiating outward -->
  <line x1="160" y1="18" x2="160" y2="42" stroke="#2c6dff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="160" y1="138" x2="160" y2="162" stroke="#2c6dff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="88" y1="90" x2="112" y2="90" stroke="#2c6dff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="208" y1="90" x2="232" y2="90" stroke="#2c6dff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Diagonal accents -->
  <line x1="109" y1="39" x2="124" y2="54" stroke="#5b8fff" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <line x1="211" y1="39" x2="196" y2="54" stroke="#5b8fff" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <line x1="109" y1="141" x2="124" y2="126" stroke="#5b8fff" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <line x1="211" y1="141" x2="196" y2="126" stroke="#5b8fff" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

  <!-- Center dot -->
  <circle cx="160" cy="90" r="5" fill="#5b8fff" opacity="0.9"/>

  <!-- Small orbit dots -->
  <circle cx="160" cy="42" r="3" fill="#2c6dff" opacity="0.7"/>
  <circle cx="208" cy="90" r="3" fill="#2c6dff" opacity="0.7"/>
  <circle cx="160" cy="138" r="3" fill="#2c6dff" opacity="0.7"/>
  <circle cx="112" cy="90" r="3" fill="#2c6dff" opacity="0.7"/>
</svg>
