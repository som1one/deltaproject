<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Background -->
  <rect width="320" height="180" rx="16" fill="#0a0a0d"/>

  <!-- Concentric arcs -->
  <path d="M 60 150 A 110 110 0 0 1 260 150" stroke="#2c6dff" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.35"/>
  <path d="M 85 150 A 85 85 0 0 1 235 150" stroke="#2c6dff" stroke-width="1" opacity="0.25"/>
  <path d="M 110 150 A 60 60 0 0 1 210 150" stroke="#5b8fff" stroke-width="1.5" opacity="0.45"/>

  <!-- Vertical signal bars -->
  <rect x="136" y="100" width="8" height="40" rx="4" fill="#2c6dff" opacity="0.5"/>
  <rect x="152" y="80" width="8" height="60" rx="4" fill="#2c6dff" opacity="0.7"/>
  <rect x="168" y="60" width="8" height="80" rx="4" fill="#5b8fff" opacity="0.85"/>
  <rect x="184" y="90" width="8" height="50" rx="4" fill="#2c6dff" opacity="0.55"/>

  <!-- Glow dot at top of tallest bar -->
  <circle cx="172" cy="56" r="5" fill="#5b8fff" opacity="0.9"/>

  <!-- Horizontal grid lines -->
  <line x1="40" y1="60" x2="280" y2="60" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="40" y1="90" x2="280" y2="90" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="40" y1="120" x2="280" y2="120" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="40" y1="150" x2="280" y2="150" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
</svg>
