# canonical: marketplace.moneymaxxxing.ru
# КАНОНИЧЕСКИЙ конфиг маркетплейса (устанавливается canonical-switch шагом
# remote-deploy.sh поверх sites-available/marketplace-moneymaxxxing).
# SSL-пути — лейнедж marketplace.moneymaxxxing.ru, выпущен ранее certbot'ом;
# options-ssl-nginx.conf / ssl-dhparams.pem кладёт certbot --nginx.

server {
    listen 80;
    server_name marketplace.moneymaxxxing.ru;

    location / {
        return 301 https://marketplace.moneymaxxxing.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name marketplace.moneymaxxxing.ru;

    ssl_certificate /etc/letsencrypt/live/marketplace.moneymaxxxing.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace.moneymaxxxing.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Весь API фронта — на /api/* того же origin: nginx снимает префикс /api
    # (трейлинг-слэш в proxy_pass) и проксирует на FastAPI. Покрывает
    # /marketplace/*, /auth/* (SSO-обмен блогера) и /me без коллизий с
    # фронтовыми Next-роутами.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Вложения чата до 100 МБ (+ запас на multipart-обвязку).
        client_max_body_size 110m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # Легаси-путь: /marketplace/* уходит в FastAPI с сохранением префикса
    # (исторические ссылки и интеграции, настроенные до появления /api/).
    location /marketplace/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 110m;
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
