# Alias-домен маркетплейса под брендом moneymaxxxing — только 301 на канонический
# домен. Отдельный файл и ОТДЕЛЬНЫЙ LE-лейнедж: живой конфиг marketplace и его
# сертификат не трогаем (--expand по ним запрещён).
# Ставится деплоем (remote-deploy.sh); certbot --nginx сам дописывает 443-блок.
#
# return сидит в location /, а не на уровне server: certbot при HTTP-01 вставляет
# свой location для /.well-known/acme-challenge/, и server-level return перебил бы
# его — проверка падала бы.

server {
    listen 80;
    server_name marketplace.moneymaxxxing.ru;

    location / {
        return 301 https://marketplace.looneymoon.ru$request_uri;
    }
}
