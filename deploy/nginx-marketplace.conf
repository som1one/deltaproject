# Marketplace subdomain — reverse proxy to Next.js (port 3001)
# Place at /etc/nginx/sites-available/marketplace and symlink to sites-enabled
# After install, run: certbot --nginx -d marketplace.looneymoon.ru

server {
    listen 80;
    server_name marketplace.looneymoon.ru;

    # API маркетплейса — тот же origin, что и сайт: проксируем на FastAPI (:8000).
    # Без этого фронт ходил бы на http://IP:8000 → mixed-content на HTTPS-сайте
    # ("Failed to fetch"). Все эндпоинты API уже под префиксом /marketplace/.
    location /marketplace/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }
}
