## /etc/nginx/sites-available/deltaproject.conf
##
## Линкуем в sites-enabled и перезагружаем nginx:
##   ln -s /etc/nginx/sites-available/deltaproject.conf /etc/nginx/sites-enabled/
##   nginx -t && systemctl reload nginx
##
## После certbot --nginx -d <domain> блок 80 заменится на редирект и появится 443.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # на старте — любой Host. После certbot подставит домен.

    # Чтобы FastAPI отдал свой /health на :8000 проверкам.
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # API → FastAPI (8000). Префикс /api/* проксируется без сохранения /api.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Всё остальное — Next.js (3000).
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Next.js dev/HMR не используется в проде — но WebSocket для SSR/streaming оставляем.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
    }
}
