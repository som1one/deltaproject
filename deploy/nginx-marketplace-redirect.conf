# canonical: marketplace.moneymaxxxing.ru
# Конфиг СТАРОГО домена маркетплейса (устанавливается canonical-switch шагом
# remote-deploy.sh поверх sites-available/marketplace): UI — 301 на новый
# домен, но /api/ и /marketplace/ ПРОДОЛЖАЮТ проксироваться — на старый адрес
# настроен вебхук ЮKassa (/api/webhooks/yookassa) и могут жить старые
# интеграции; редирект POST-вебхука ЮKassa не переживёт.
# SSL — прежний лейнедж marketplace.looneymoon.ru (он же покрывает
# looneymoon.ru); НЕ расширять и не переименовывать.

server {
    listen 80;
    server_name marketplace.looneymoon.ru;

    location / {
        return 301 https://marketplace.moneymaxxxing.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name marketplace.looneymoon.ru;

    ssl_certificate /etc/letsencrypt/live/marketplace.looneymoon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace.looneymoon.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 110m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    location /marketplace/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 110m;
    }

    location / {
        return 301 https://marketplace.moneymaxxxing.ru$request_uri;
    }
}
