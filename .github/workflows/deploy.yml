name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # 1. Гоняем быстрые проверки до деплоя. Если упадёт — деплой не побежит.
  # -----------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/app
          JWT_SECRET_KEY: ci-dummy-jwt-secret
          REFRESH_TOKEN_SECRET_KEY: ci-dummy-refresh-secret
          PAYOUT_CARD_PEPPER: ci-dummy-pepper
          APP_ENV: test
        run: python -m pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit --ignoreDeprecations 6.0 -p .

  # -----------------------------------------------------------------------
  # 2. Деплой на VPS по SSH-паролю (root). Все значения — через GitHub Secrets.
  #    ВНИМАНИЕ: парольный root-деплой — временное решение. При первой
  #    возможности переключиться на ключ (key вместо password).
  # -----------------------------------------------------------------------
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger remote deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            # Готовим swap ДО тяжёлых билдов: без него npm ci / next build ловят
            # OOM-killer (exit 137). Делаем это здесь, в workflow, а не в
            # remote-deploy.sh — тот на сервере обновляет сам себя и подхватил бы
            # правку лишь на следующий прогон; этот же файл Actions читает сразу
            # из свежего коммита, поэтому фикс срабатывает с первого пуша.
            ( set -e
              if [ "$(wc -l < /proc/swaps)" -le 1 ]; then
                if [ ! -e /swapfile ]; then
                  fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                  chmod 600 /swapfile
                  mkswap /swapfile
                fi
                swapon /swapfile
                grep -q '^/swapfile[[:space:]]' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
              fi ) || echo "[deploy] swap setup skipped/failed, continuing"
            swapon --show || true
            free -h || true
            cd ${{ secrets.DEPLOY_PATH }}
            # Обновляем репо ДО запуска remote-deploy.sh. Скрипт делает git reset
            # сам, но bash к тому моменту уже держит открытым СТАРЫЙ файл, поэтому
            # правки в нём доезжали только следующим прогоном. Здесь же скрипт
            # стартует уже из свежего коммита; внутренний git reset остаётся
            # no-op'ом и страхует ручные запуски.
            git fetch --all --prune
            git reset --hard origin/main
            ./deploy/remote-deploy.sh
