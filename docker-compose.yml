services:
  postgres:
    image: postgres:16-alpine
    container_name: deltaproject-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  admin-bootstrap:
    image: python:3.12-slim
    container_name: deltaproject-admin-bootstrap
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python -m utils.create_admin
      --name deltasmaxadmin
      --email ${ADMIN_BOOTSTRAP_EMAIL:-admin-draft@example.com}
      --password ${ADMIN_BOOTSTRAP_PASSWORD:-draft_admin_password_change_me}
      --telegram ${ADMIN_BOOTSTRAP_TELEGRAM:-@draft_admin}"
    restart: "no"

volumes:
  pgdata:
